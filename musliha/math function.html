<html>
<head>
<title>math function</title>
</head>

<body bgcolor="grey">
<h1><center><i>String & Math function</i></center></h1>

<script>

var a="hello";
var b="world";
var c="WP";
document.write("string 1=" + a + "<br><br>");
document.write("string 2=" + b + "<br><br>");
document.write("string 3=" + c + "<br><br>");
document.write("<h2>string function</h2>");
document.write("concatination = " + a + b + c + "<br></br>");
document.write("length=" + a.length + "<br></br>");
document.write("UpperCase=" + b.toUpperCase() + "<br></br>");
document.write("LowerCase=" + c.toLowerCase() + "<br></br>");
document.write("slice="+ a.slice(1,3) +"<br></br>");
document.write("replace="+ c.replace("W","S") +"<br></br>");


document.write("<h2>Math function</h2>");
document.write("square root of 25=" + Math.sqrt(25) +"<br></br>");
document.write("power of (2,3)=" + Math.pow(2,3) + "<br></br>");
document.write("absolute value of -10=" + Math.abs(-10) + "<br></br>" );
document.write("round of (4.6)=" + Math.round(4.6) + "<br></br>");
document.write("ceil of (4.6)=" + Math.ceil(4.6) + "<br></br>");
document.write("floor of (4.6)=" + Math.floor(4.6) + "<br></br>");
document.write("Minimum of (4,6,8,7,5)=" + Math.min(4,6,8,7,5) + "<br></br>");
document.write("Maximum of (4.6,4.7)=" + Math.max(4.6,4.7) + "<br></br>");

</script>
</body>
</html>
