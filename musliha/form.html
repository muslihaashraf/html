<!doctype html>
<html>
<head>
<title>form </title>
</head>
<body>
<h2>Student ragistration form</h2>
<form>

<label>Name:</label>
<input type="text" name="name">
<br><br>
<label>Email:</label>
<input type="email" name="email">
<br><br>
<label>Password:</label>
<input type="password" name="password">
<br><br>
<label>Age:</label>
<input type="number" name="age">
<br><br>
<label>Gender:</label>
<input type="radio" name="gender" value="mail">Male
<input type="radio" name="gender" value="femail">Female
<br><br>
<label>course:</label>
<select name="course">
<option>MCA</option>
<option>MBA</option>
<option>M.TECH</option>
</select>
<br><br>
<label>Hobbies:</label>
<input type="checkbox" name="hobby" value="scrolling">Scrolling
<input type="checkbox" name="hobby" value="sports">Sports
<input type="checkbox" name="hobby" value="music">Music
<br><br>
<label>Address:</label>
<textarea name="address" rows="4" cols="30"></textarea>
<br><br>
<label>Date of birth</label>
<input type="date" name="dob">
<br><br>
<input type="submit" value="Register">
<input type="reset" value="clear">
</form>
</body>
</html>
